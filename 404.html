<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Страница не найдена · Ольга Пузанова</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/olgapuzanova/favicon.svg" type="image/svg+xml" />
<style>
  @font-face {
    font-family: "Inter Tight";
    font-weight: 500;
    font-display: swap;
    src: url(/olgapuzanova/fonts/inter-tight-cyrillic-500-normal.woff2) format("woff2");
    unicode-range: U+0400-045F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #0c0e0b; color: #f2f4ee; text-align: center;
    font-family: "Inter Tight", system-ui, sans-serif; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; width: 520px; height: 520px; border-radius: 50%;
    background: #c8f53c; filter: blur(120px); opacity: .18; top: -200px; right: -120px;
  }
  .num { font-size: clamp(90px, 22vw, 200px); font-weight: 500; letter-spacing: -.06em; line-height: 1; color: #c8f53c }
  h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 500; letter-spacing: -.03em; margin: 18px 0 10px }
  p { color: #8d9387; margin-bottom: 32px }
  a {
    display: inline-block; background: #c8f53c; color: #0c0e0b; text-decoration: none;
    font-weight: 500; padding: 18px 28px; border-radius: 999px;
  }
</style>
</head>
<body>
  <main>
    <div class="num">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела. Всё главное есть на&nbsp;главной.</p>
    <a href="/olgapuzanova/">На главную</a>
  </main>
</body>
